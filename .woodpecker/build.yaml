# Reviewed maintenance only: upgrade the static plugin, never release products.
labels:
  pool: general
concurrency: 1
when:
  - event: [push, manual]
    branch: maintenance/server-publisher-upgrade-20261008
steps:
  - name: upgrade-static-publisher
    image: univenanne-ci-general:20260918
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - python3 maintenance/publisher/test_upgrade.py
      - python3 maintenance/publisher/upgrade.py
