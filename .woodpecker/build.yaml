# Build and atomically deploy the approved wiki snapshot on the existing server.
labels:
  pool: general
concurrency: 1
when:
  - event: [push, manual]
    branch: maintenance/wiki-server-deploy-20261008
# Merge these steps into the root-owned temporary maintenance pipeline.
# The public site is already configured. Only its storage tree is mounted here.
steps:
  - name: wiki-deploy-fixtures
    image: python:3.12-bookworm
    commands:
      - python maintenance/wiki/test_deploy.py
  - name: wiki-static-build
    image: node:24-bookworm
    depends_on:
      - wiki-deploy-fixtures
    commands:
      - sh maintenance/wiki/build.sh
  - name: wiki-static-deploy
    image: python:3.12-bookworm
    depends_on:
      - wiki-static-build
    volumes:
      - /opt/docker/nimbyrailsfrance-wiki:/wiki
    commands:
      - python maintenance/wiki/deploy.py --source .ci/wiki-153a1f0baafa06801229aa7c0b2ad061f8277e68/.output/public --release 20261008-153a1f0
