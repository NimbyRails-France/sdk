# Verify and package every commit; only an explicit release subject publishes.
labels:
  pool: general
concurrency: 1
when:
  - event: [push, manual]
steps:
  - name: windows-build-and-tests
    image: univenanne-ci-nimby-release:20260918
    commands:
      - "case $CI_COMMIT_MESSAGE in *\"Release-Runner: github\"*) echo GitHub runner selected; exit 0 ;; esac"
      - python3 .woodpecker/test-github-release.py
      - python3 .woodpecker/test-release-metadata.py
      - python3 .woodpecker/test-sdk-package.py
      - sh .woodpecker/build.sh
      - python3 .woodpecker/package.py
  - name: publish-github-release
    image: python:3.12-alpine
    environment:
      NRF_RELEASE_TOKEN:
        from_secret: nrf_release_token
    commands:
      - "case $CI_COMMIT_MESSAGE in *\"Release-Runner: github\"*) echo GitHub runner selected; exit 0 ;; esac"
      - python .woodpecker/github-release.py
  - name: publish-distribution-server
    image: python:3.12-alpine
    volumes:
      - /opt/docker/nimbyrailsfrance-distribution/storage:/distribution
    commands:
      - "case $CI_COMMIT_MESSAGE in *\"Release-Runner: github\"*) echo GitHub runner selected; exit 0 ;; esac"
      - python .woodpecker/distribution.py
