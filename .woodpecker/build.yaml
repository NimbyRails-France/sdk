# Check the approved secret filter against the next publisher image tag.
labels:
  pool: general
concurrency: 1
when:
  - event: [push, manual]
    branch: maintenance/server-publisher-upgrade-20261008
steps:
  - name: publisher-image-policy-check
    image: univenanne-ci-nimby-publisher:20261008
    settings:
      mode: check
      token:
        from_secret: nrf_release_token
