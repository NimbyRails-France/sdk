# Alpha binaries are validated and published from the Windows release procedure.
# The general pool validates release metadata only; it does not publish assets.
labels:
  pool: general
when:
  - event: [push, manual]
    branch: alpha
steps:
  - name: alpha-release-metadata
    image: python:3.12-slim
    commands:
      - python3 .woodpecker/check-release.py
